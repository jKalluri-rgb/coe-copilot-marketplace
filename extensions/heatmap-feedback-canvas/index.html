<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Heatmap Feedback</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f6f8fb;
      color: #172034;
    }

    .container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h2 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      color: #667085;
      font-size: 14px;
    }

    /*
     * ------------------------------------------------------------
     * List layout
     * ------------------------------------------------------------
     */

    .table-header,
    .feedback-row {
      display: grid;

      grid-template-columns:
        60px
        minmax(160px, 1fr)
        190px
        minmax(240px, 2fr);

      gap: 18px;
      align-items: center;
    }

    .table-header {
      padding: 0 20px 10px;

      color: #667085;
      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #feedback-list {
      min-height: 80px;
    }

    .feedback-row {
      margin-bottom: 10px;
      padding: 20px;

      border: 1px solid #dfe3eb;
      border-radius: 14px;

      background: #ffffff;

      box-shadow:
        0 3px 10px
        rgba(16, 24, 40, 0.05);
    }

    .serial-number {
      color: #667085;
      font-weight: 600;
    }

    .item-name {
      min-width: 0;

      overflow-wrap: anywhere;

      font-size: 16px;
      font-weight: 700;
    }

    /*
     * ------------------------------------------------------------
     * Star rating
     * ------------------------------------------------------------
     */

    .stars {
      display: inline-flex;

      /*
       * Inputs are generated 5 -> 1.
       * row-reverse allows the sibling selectors below to highlight
       * all stars up to the selected rating.
       */
      flex-direction: row-reverse;
      justify-content: flex-end;

      gap: 2px;

      margin: 0;
      padding: 0;

      border: 0;
    }

    .stars legend {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;

      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);

      white-space: nowrap;
    }

    .stars input {
      position: absolute;

      width: 1px;
      height: 1px;

      opacity: 0;
    }

    .stars label {
      cursor: pointer;

      color: #cfd4dc;

      font-size: 30px;
      line-height: 1;

      transition:
        color 120ms ease,
        transform 120ms ease;
    }

    .stars label:hover,
    .stars label:hover ~ label,
    .stars input:checked ~ label {
      color: #f5b301;
    }

    .stars label:hover {
      transform: scale(1.1);
    }

    /*
     * Keyboard users still need to see focus even though
     * the radio input itself is visually hidden.
     */

    .stars input:focus-visible + label {
      border-radius: 4px;

      outline:
        3px solid
        rgba(37, 99, 235, 0.35);

      outline-offset: 2px;
    }

    /*
     * ------------------------------------------------------------
     * Feedback
     * ------------------------------------------------------------
     */

    textarea {
      width: 100%;
      min-height: 78px;

      resize: vertical;

      padding: 11px 12px;

      border: 1px solid #cfd4dc;
      border-radius: 9px;

      background: #ffffff;
      color: #172034;

      font: inherit;
    }

    textarea:focus {
      border-color: #2563eb;

      outline:
        3px solid
        rgba(37, 99, 235, 0.14);
    }

    /*
     * ------------------------------------------------------------
     * Footer
     * ------------------------------------------------------------
     */

    .footer {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 16px;

      margin-top: 18px;
    }

    .status {
      min-height: 22px;

      font-size: 14px;
    }

    .status.loading {
      color: #667085;
    }

    .status.success {
      color: #067647;
    }

    .status.error {
      color: #b42318;
    }

    button {
      min-width: 120px;

      padding: 11px 20px;

      border: 0;
      border-radius: 9px;

      background: #2563eb;
      color: #ffffff;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:focus-visible {
      outline:
        3px solid
        rgba(37, 99, 235, 0.3);

      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    /*
     * ------------------------------------------------------------
     * Loading state
     * ------------------------------------------------------------
     */

    .loading-placeholder {
      padding: 24px;

      border: 1px solid #dfe3eb;
      border-radius: 14px;

      background: #ffffff;

      color: #667085;

      text-align: center;
    }

    /*
     * ------------------------------------------------------------
     * Responsive
     * ------------------------------------------------------------
     */

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .table-header {
        display: none;
      }

      .feedback-row {
        grid-template-columns:
          40px 1fr;

        gap: 14px;
      }

      .feedback-row .stars,
      .feedback-row textarea {
        grid-column: 2;
      }

      .footer {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }
    }

    /*
     * ------------------------------------------------------------
     * Dark mode
     * ------------------------------------------------------------
     */

    @media (prefers-color-scheme: dark) {
      body {
        background: #101828;
        color: #f2f4f7;
      }

      .header p,
      .table-header,
      .serial-number,
      .status.loading {
        color: #98a2b3;
      }

      .feedback-row,
      .loading-placeholder {
        border-color: #344054;
        background: #1d2939;
      }

      .loading-placeholder {
        color: #98a2b3;
      }

      textarea {
        border-color: #475467;

        background: #101828;
        color: #f2f4f7;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h2>Heatmap Feedback</h2>

      <p>
        Rate each heatmap and optionally provide additional feedback.
      </p>
    </header>


    <div class="table-header" aria-hidden="true">
      <div>S.No</div>
      <div>Item</div>
      <div>Rating</div>
      <div>Feedback</div>
    </div>


    <div
      id="feedback-list"
      aria-busy="true"
    >
      <div class="loading-placeholder">
        Loading heatmaps...
      </div>
    </div>


    <div class="footer">

      <div
        id="status"
        class="status loading"
        role="status"
        aria-live="polite"
      >
        Loading heatmaps...
      </div>


      <button
        id="submit-button"
        type="button"
        disabled
      >
        Submit
      </button>

    </div>

  </main>


  <!--
    One row is cloned for every heatmap returned by:

        GET /heatmaps
  -->

  <template id="feedback-row-template">

    <section class="feedback-row">

      <div
        class="serial-number"
        aria-label="Serial number"
      ></div>


      <div class="item-name"></div>


      <fieldset class="stars">

        <legend>
          Select a rating
        </legend>


        <input
          type="radio"
          value="5"
        >

        <label
          title="5 stars"
          aria-label="5 stars"
        >
          ★
        </label>


        <input
          type="radio"
          value="4"
        >

        <label
          title="4 stars"
          aria-label="4 stars"
        >
          ★
        </label>


        <input
          type="radio"
          value="3"
        >

        <label
          title="3 stars"
          aria-label="3 stars"
        >
          ★
        </label>


        <input
          type="radio"
          value="2"
        >

        <label
          title="2 stars"
          aria-label="2 stars"
        >
          ★
        </label>


        <input
          type="radio"
          value="1"
        >

        <label
          title="1 star"
          aria-label="1 star"
        >
          ★
        </label>

      </fieldset>


      <textarea
        maxlength="2000"
        placeholder="Write your feedback..."
      ></textarea>

    </section>

  </template>


  <script>

    let heatmaps = [];


    const elements = {

      list:
        document.getElementById(
          "feedback-list"
        ),

      template:
        document.getElementById(
          "feedback-row-template"
        ),

      submitButton:
        document.getElementById(
          "submit-button"
        ),

      status:
        document.getElementById(
          "status"
        )
    };


    /*
     * ------------------------------------------------------------
     * Status
     * ------------------------------------------------------------
     */

    function setStatus(
      message,
      type = "loading"
    ) {

      elements.status.textContent =
        message;


      elements.status.className =
        `status ${type}`;
    }


    /*
     * ------------------------------------------------------------
     * HTTP response helper
     * ------------------------------------------------------------
     */

    async function readResponse(
      response
    ) {

      const contentType =
        response.headers.get(
          "content-type"
        ) ?? "";


      let result;


      if (
        contentType.includes(
          "application/json"
        )
      ) {

        result =
          await response.json();

      } else {

        const text =
          await response.text();


        result = {
          error:
            text ||
            `HTTP ${response.status}`
        };
      }


      if (!response.ok) {

        throw new Error(

          result.error ??
          result.detail ??
          `Request failed with HTTP ${response.status}.`

        );
      }


      return result;
    }


    /*
     * ------------------------------------------------------------
     * Render all heatmaps
     * ------------------------------------------------------------
     */

    function renderHeatmaps() {

      elements.list.replaceChildren();


      heatmaps.forEach(
        (
          heatmap,
          index
        ) => {

          const fragment =
            elements.template
              .content
              .cloneNode(true);


          const row =
            fragment.querySelector(
              ".feedback-row"
            );


          /*
           * Keep the API ID associated with its row.
           */

          row.dataset.heatmapId =
            heatmap.id;


          /*
           * S.No
           */

          const serialNumber =
            fragment.querySelector(
              ".serial-number"
            );


          serialNumber.textContent =
            String(index + 1);


          /*
           * Item name
           */

          const itemName =
            fragment.querySelector(
              ".item-name"
            );


          itemName.textContent =
            heatmap.name;


          /*
           * Rating
           *
           * Every row needs a unique radio-group name;
           * otherwise selecting a star on one row would
           * deselect the rating on another row.
           */

          const fieldset =
            fragment.querySelector(
              ".stars"
            );


          fieldset.setAttribute(
            "aria-label",
            `Rating for ${heatmap.name}`
          );


          const radioInputs =
            fragment.querySelectorAll(
              '.stars input[type="radio"]'
            );


          const labels =
            fragment.querySelectorAll(
              ".stars label"
            );


          radioInputs.forEach(
            (
              input,
              position
            ) => {

              const id =
                `heatmap-${index}-rating-${input.value}`;


              input.id =
                id;


              input.name =
                `heatmap-rating-${index}`;


              labels[
                position
              ].htmlFor =
                id;
            }
          );


          /*
           * Feedback textbox
           */

          const textarea =
            fragment.querySelector(
              "textarea"
            );


          textarea.setAttribute(
            "aria-label",
            `Feedback for ${heatmap.name}`
          );


          elements.list.appendChild(
            fragment
          );
        }
      );
    }


    /*
     * ------------------------------------------------------------
     * GET heatmaps
     *
     * Browser:
     *     GET /api/heatmaps
     *
     * extension.mjs:
     *     GET FastAPI /heatmaps
     *
     * Expected response:
     *
     * {
     *   "heatmaps": [
     *     {
     *       "id": "...",
     *       "name": "..."
     *     }
     *   ]
     * }
     * ------------------------------------------------------------
     */

    async function loadHeatmaps() {

      elements.list.setAttribute(
        "aria-busy",
        "true"
      );


      elements.submitButton.disabled =
        true;


      setStatus(
        "Loading heatmaps...",
        "loading"
      );


      try {

        const response =
          await fetch(
            "/api/heatmaps",
            {
              method:
                "GET",

              headers: {
                Accept:
                  "application/json"
              },

              cache:
                "no-store"
            }
          );


        const result =
          await readResponse(
            response
          );


        if (
          !Array.isArray(
            result.heatmaps
          )
        ) {

          throw new Error(
            "Invalid heatmap response received from the server."
          );
        }


        /*
         * Basic frontend validation.
         *
         * FastAPI/Pydantic remains the source of truth
         * for server-side validation.
         */

        for (
          const heatmap
          of result.heatmaps
        ) {

          if (
            !heatmap ||
            typeof heatmap.id !== "string" ||
            typeof heatmap.name !== "string"
          ) {

            throw new Error(
              "One or more heatmaps contain invalid data."
            );
          }
        }


        heatmaps =
          result.heatmaps;


        renderHeatmaps();


        if (
          heatmaps.length === 0
        ) {

          elements.list.innerHTML =
            '<div class="loading-placeholder">' +
            'No heatmaps are available.' +
            '</div>';


          setStatus(
            "No heatmaps are available.",
            "loading"
          );


          return;
        }


        elements.submitButton.disabled =
          false;


        setStatus(

          `${heatmaps.length} heatmap${
            heatmaps.length === 1
              ? ""
              : "s"
          } loaded.`,

          "success"
        );

      } catch (error) {

        console.error(
          "Failed to load heatmaps:",
          error
        );


        elements.list.innerHTML =
          '<div class="loading-placeholder">' +
          'Unable to load heatmaps.' +
          '</div>';


        setStatus(

          error instanceof Error
            ? error.message
            : "Could not load heatmaps.",

          "error"
        );

      } finally {

        elements.list.setAttribute(
          "aria-busy",
          "false"
        );
      }
    }


    /*
     * ------------------------------------------------------------
     * Collect current UI state
     *
     * Output:
     *
     * [
     *   {
     *     id: "...",
     *     rating: 5,
     *     feedback: "..."
     *   }
     * ]
     * ------------------------------------------------------------
     */

    function collectFeedback() {

      const rows =
        elements.list.querySelectorAll(
          ".feedback-row"
        );


      return Array.from(
        rows
      ).map(
        row => {

          const selectedRating =
            row.querySelector(
              '.stars input[type="radio"]:checked'
            );


          const textarea =
            row.querySelector(
              "textarea"
            );


          return {

            id:
              row.dataset.heatmapId,

            rating:
              selectedRating
                ? Number(
                    selectedRating.value
                  )
                : null,

            feedback:
              textarea.value.trim()
          };
        }
      );
    }


    /*
     * ------------------------------------------------------------
     * Disable/enable form while POST is running
     * ------------------------------------------------------------
     */

    function setSubmitting(
      submitting
    ) {

      elements.submitButton.disabled =
        submitting;


      elements.submitButton.textContent =
        submitting
          ? "Submitting..."
          : "Submit";


      const controls =
        elements.list.querySelectorAll(
          "input, textarea"
        );


      for (
        const control
        of controls
      ) {

        control.disabled =
          submitting;
      }
    }


    /*
     * ------------------------------------------------------------
     * Submit all feedback
     *
     * FastAPI model:
     *
     * class SubmitFeedbackRequest(BaseModel):
     *     feedbacks: list[HeatMapFeedback]
     *
     * JSON:
     *
     * {
     *   "feedbacks": [...]
     * }
     * ------------------------------------------------------------
     */

    async function submitFeedback() {

      if (
        heatmaps.length === 0
      ) {

        setStatus(
          "There are no heatmaps to submit.",
          "error"
        );

        return;
      }


      const feedbacks =
        collectFeedback();


      /*
       * HeatMapFeedback.rating is required and
       * Pydantic requires 1 <= rating <= 5.
       */

      const unratedFeedback =
        feedbacks.filter(
          item =>
            item.rating === null
        );


      if (
        unratedFeedback.length > 0
      ) {

        setStatus(

          `Please rate all heatmaps. ${
            unratedFeedback.length
          } ${
            unratedFeedback.length === 1
              ? "item is"
              : "items are"
          } still unrated.`,

          "error"
        );


        return;
      }


      setSubmitting(
        true
      );


      setStatus(
        "Submitting feedback...",
        "loading"
      );


      try {

        const response =
          await fetch(
            "/api/submit-feedback",
            {
              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json",

                Accept:
                  "application/json"
              },

              body:
                JSON.stringify({
                  feedbacks
                })
            }
          );


        await readResponse(
          response
        );


        setStatus(
          "Feedback submitted successfully.",
          "success"
        );

      } catch (error) {

        console.error(
          "Failed to submit feedback:",
          error
        );


        setStatus(

          error instanceof Error
            ? error.message
            : "Could not submit feedback.",

          "error"
        );

      } finally {

        setSubmitting(
          false
        );
      }
    }


    /*
     * ------------------------------------------------------------
     * Events
     * ------------------------------------------------------------
     */

    elements.submitButton.addEventListener(
      "click",
      submitFeedback
    );


    /*
     * The native Canvas URL is served by extension.mjs.
     * There is no MCP Apps ui/initialize handshake.
     */

    loadHeatmaps();

  </script>

</body>
</html>
